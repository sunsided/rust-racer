# ECS spec: sillyecs reads this in build.rs and generates the World, components and systems.

# Generate the unchecked archetype fast-paths wrapped in `unsafe` blocks.
allow_unsafe: true

# The component data, states and system data live in (or are re-exported from) `crate::ecs`.
paths:
  components: crate::ecs
  states: crate::ecs
  systems: crate::ecs

states:
  - name: Track
    description: The road geometry and roadside scenery; never changes during a race.
  - name: Controls
    description: The driving controls held this frame, written by the game loop.
  - name: TrafficGrid
    description: The AI cars in each track segment, rebuilt every step.
  - name: PlayerView
    description: The player car as of the last step, for the traffic AI and the renderer.
  - name: Backdrop
    description: Scroll offsets of the parallax background layers.
  - name: Laps
    description: Current, last and fastest lap times.

components:
  - name: TrackPosition
  - name: Speed
  - name: CarModel
  - name: Driver
  - name: StepOrigin
    description: Where on the track the entity started the current step.

archetypes:
  - name: Car
    description: An AI car driving along the track.
    components:
      - TrackPosition
      - Speed
      - CarModel

  - name: Player
    description: The car the player drives.
    components:
      - TrackPosition
      - Speed
      - Driver
      - StepOrigin

phases:
  - name: FixedUpdate
    fixed: 60 Hz

systems:
  - name: Traffic
    stateless: true
    description: Steers the AI cars around slower traffic and the player, and moves them.
    phase: FixedUpdate
    states:
      - use: Track
      - use: TrafficGrid
      - use: PlayerView
    inputs:
      - Speed
      - CarModel
    outputs:
      - TrackPosition

  - name: TrafficIndex
    stateless: true
    description: Buckets the AI cars into their track segments.
    phase: FixedUpdate
    run_after: [Traffic]
    states:
      - use: Track
      - use: TrafficGrid
        default: write
    inputs:
      - TrackPosition
      - Speed
      - CarModel

  - name: Driving
    stateless: true
    description: Applies the player's controls, the curves' centrifugal force and off-road drag.
    phase: FixedUpdate
    run_after: [TrafficIndex]
    states:
      - use: Track
      - use: Controls
    outputs:
      - TrackPosition
      - Speed
      - Driver
      - StepOrigin

  - name: Collision
    stateless: true
    description: Stops the player at roadside scenery and behind slower cars.
    phase: FixedUpdate
    run_after: [Driving]
    states:
      - use: Track
      - use: TrafficGrid
    inputs:
      - StepOrigin
    outputs:
      - TrackPosition
      - Speed

  - name: LapTimer
    stateless: true
    description: Times laps as the player crosses the start line.
    phase: FixedUpdate
    run_after: [Collision]
    states:
      - use: Laps
        default: write
    inputs:
      - TrackPosition
      - StepOrigin

  - name: Parallax
    stateless: true
    description: Scrolls the background layers as the player drives through curves.
    phase: FixedUpdate
    run_after: [Collision]
    states:
      - use: Track
      - use: Backdrop
        default: write
    inputs:
      - TrackPosition
      - StepOrigin

  - name: Snapshot
    stateless: true
    description: Publishes the player car's state for the traffic AI and the renderer.
    phase: FixedUpdate
    run_after: [Collision]
    states:
      - use: PlayerView
        default: write
    inputs:
      - TrackPosition
      - Speed
      - Driver

worlds:
  - name: Main
    archetypes:
      - Car
      - Player
