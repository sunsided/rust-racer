[package]
name = "rust-racer"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "EUPL-1.2 OR MIT OR Apache-2.0"
description = "An OutRun-style pseudo-3D racer, ported from jakesgordon/javascript-racer onto game-toolkit."

[dependencies]
game-toolkit = { version = "0.5", features = ["ecs"] }
log = "0.4"
# Runtime types (`EntityId`, `FrameContext`, ...) and re-exports the generated ECS code uses.
sillyecs = "0.2.1"

# Native builds log via env_logger; on the web the toolkit logs to the browser console.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# In the browser, time the ECS phases with `performance.now()`; `std::time::Instant` panics there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sillyecs = { version = "0.2.1", features = ["wasm"] }

[build-dependencies]
sillyecs-build = "0.2.1"

# Decoding the music and pushing ~5k quads a frame is painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
