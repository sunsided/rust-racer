name: Release

# Creates a GitHub release for a pushed version tag. The notes are the annotated tag's message
# followed by GitHub's generated changelog; a release that already exists (e.g. written by hand
# before pushing the tag) is left alone. Run it manually to release an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.0
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Create release
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it alone."
            exit 0
          fi
          ref=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')
          notes=""
          if [ "${ref%% *}" = "tag" ]; then
            notes=$(gh api "repos/${GH_REPO}/git/tags/${ref#* }" --jq .message)
          fi
          gh release create "${TAG}" --verify-tag --title "${TAG}" --notes "${notes}" --generate-notes
