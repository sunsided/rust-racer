name: Pages

# Builds the book with mdBook and the browser version with trunk (served under play/) and,
# on main, deploys both to GitHub Pages.
# Deliberately uncached: a deployed build must not restore caches written by other refs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build (trunk, mdBook)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      # trunk fetches the wasm-bindgen CLI matching Cargo.lock on its own.
      - name: Install trunk
        run: |
          curl -fsSLo trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum --check
          tar -xzf trunk.tar.gz -C "${HOME}/.cargo/bin"
          rm trunk.tar.gz
      - name: Install mdBook
        run: |
          curl -fsSLo mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check
          tar -xzf mdbook.tar.gz -C "${HOME}/.cargo/bin"
          rm mdbook.tar.gz
      # The book is the site root and embeds the game from play/. mdBook empties its destination
      # first, so it has to build before trunk writes into dist/play.
      - name: Build book
        run: mdbook build book --dest-dir dist
      - name: Build game
        run: trunk build --release --locked --dist dist/play
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
